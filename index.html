<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Robust Labs</title>
        <style>
            @font-face {
                font-family: "HK Grotesk";
                src: url("assets/fonts/hkgrotesk_regular.woff")
                    format("woff");
                font-weight: 400;
                font-style: normal;
            }
            @font-face {
                font-family: "HK Grotesk";
                src: url("assets/fonts/hkgrotesk_bold.woff") format("woff");
                font-weight: 700;
                font-style: normal;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                background: #1a1a1f;
                color: #ebebeb;
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica,
                    Arial, sans-serif;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 2rem;
            }
            .container {
                max-width: 600px;
                width: 100%;
            }
            h1 {
                font-size: 1.5rem;
                font-weight: 600;
                margin-bottom: 5rem;
                color: #e0d4f5;
            }
            h2 {
                font-size: 0.875rem;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                margin-bottom: 1rem;
                color: #ebebeb;
            }
            p,
            li {
                font-size: 0.95rem;
                line-height: 1.8;
            }
            section {
                margin-bottom: 4rem;
            }
            ul {
                list-style: none;
                padding: 0;
            }
            ul li::before {
                content: "– ";
                color: #a0a0a0;
            }
            .cacha-item {
                display: flex;
                align-items: center;
                gap: 0.6rem;
            }
            .cacha-item::before {
                display: none;
            }
            .cacha-logo {
                width: 24px;
                height: 24px;
                object-fit: contain;
                flex-shrink: 0;
            }
            .cacha-name {
                font-family: "HK Grotesk", sans-serif;
                font-weight: 700;
                color: #ebebeb;
            }
            .cacha-link {
                display: flex;
                align-items: center;
                gap: 0.6rem;
                text-decoration: none;
            }
            .cacha-link:hover .cacha-name {
                text-decoration: underline;
            }
            a {
                color: #ebebeb;
                text-decoration: none;
            }
            a:hover {
                text-decoration: underline;
            }
            footer {
                margin-top: 5rem;
                font-size: 0.8rem;
                color: #888888;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Robust Labs LLC</h1>

            <section>
                <h2>About Us</h2>
                <p>
                    Robust Labs is focused on using AI to deliver productivity,
                    education and gaming apps with maximum value at marginal
                    cost.
                </p>
            </section>

            <section>
                <h2>Our Products</h2>
                <ul>
                    <li class="cacha-item">
                        <a href="https://cacha.app" class="cacha-link"><img src="assets/cacha-logo.png" alt="Cacha logo" class="cacha-logo" /><span class="cacha-name">Cacha</span></a> — A minimalist thought-capture app
                    </li>
                </ul>
            </section>

            <section>
                <h2>Reach Out</h2>
                <p>hey@robustlabs.xyz</p>
            </section>

            <footer>&copy; 2026 Robust Labs LLC</footer>
        </div>
    </body>
</html>
