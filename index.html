<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robust Labs LLC</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a1f;
            color: #e8e4f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .container {
            max-width: 600px;
            width: 100%;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 2rem;
        }
        h2 {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            color: #d0cbdf;
        }
        p, li {
            font-size: 0.95rem;
            line-height: 1.6;
        }
        section { margin-bottom: 2rem; }
        ul {
            list-style: none;
            padding: 0;
        }
        ul li::before {
            content: "– ";
            color: #a9a2be;
        }
        a {
            color: #c4bdd6;
            text-decoration: none;
        }
        a:hover { text-decoration: underline; }
        footer {
            margin-top: 3rem;
            font-size: 0.8rem;
            color: #8a8499;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Robust Labs LLC</h1>

        <section>
            <h2>About Us</h2>
            <p>Robust Labs LLC is a technology company specializing in mobile application development.</p>
        </section>

        <section>
            <h2>Our Products</h2>
            <ul>
                <li><strong>Cacha</strong> — A minimalist thought-capture app (<a href="https://cacha.app">cacha.app</a>)</li>
            </ul>
        </section>

        <section>
            <h2>Contact</h2>
            <p>rob@robustlabs.xyz</p>
            <p>Brooklyn, NY</p>
        </section>

        <footer>&copy; 2024 Robust Labs LLC</footer>
    </div>
</body>
</html>
